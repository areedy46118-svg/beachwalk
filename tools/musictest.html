<!doctype html>
<meta charset="utf-8">
<title>music test</title>
<!-- tools/musictest.js in a headless Chrome of its own (tools/musictest.sh): every scenario, one after another, each
     printed as "[MT] <scenario> PASS|FAIL <peak> <note>". Its own profile, its own save. Not part of the game. -->
<body>
<script type="module">
await import('/tools/silentframe.js'); await import('/tools/musictest.js');
const log = (...a) => console.log('[MT]', ...a);
// a checkpoint to load for the 'checkpoint' scenario: a fresh start, saved on the beach
await window.__sfLoad(() => sessionStorage.setItem('beachwalk.skipIntro', '1'));
for (let i = 0; i < 200; i++) { await new Promise((r) => setTimeout(r, 250)); const w = window.__sfW(); if (w && w.__bw && w.__bw.state().started) break; try { w.__bw.beginGame(); } catch (e) {} }
await new Promise((r) => setTimeout(r, 3000));
try { const b = window.__sfW().__bw; b.camera.position.set(8, 1.7, -60); await new Promise((r) => setTimeout(r, 400)); b.saveCheckpoint(); await b.audioCtx.close(); } catch (e) { log('save failed', e); }
const only = new URLSearchParams(location.search).get('only');   // ?only=end,samurai: just those
for (const s of (only ? only.split(',') : ['restart', 'checkpoint', 'load', 'samurai', 'samuraiBack', 'church', 'end', 'mino', 'skrim', 'skrimFight'])) {
  let r; try { r = await window.__mtRun(s); } catch (e) { r = { scenario: s, pass: false, note: 'THREW ' + e }; }
  log(r.scenario, r.pass ? 'PASS' : 'FAIL', r.peak, r.note || '');
}
log('DONE');
</script>
