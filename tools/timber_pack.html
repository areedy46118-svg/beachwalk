     of the barrels in the owner's own furniture set (assets/furniture.glb, image 6), its wood half. Every board is its own
     piece of it (offset, flip, tone); wear is from the owner's scans (mottle, smudge, streaks, pitting) and from noise
     fields, NEVER from circles; rust is the rust tile's own (assets/wreck-rust.jpg).
       inner  2048x1024  her lining: 5.9 x 2.95 m, boards lying, the tide line two thirds down
       sole   2048x1024  her floor: 5.9 x 2.95 m, worn and wet, sand in the seams
       wood   1024x512   loose timber: 2 x 1 m of grain, checks along it, no boards
       stores 1024x1024  a drop-in for the pirate set's trim sheet, band for band (its UVs are untouched)
       sack   512x512    burlap, for the set's tartan
     Run: PB_PAGE=timber_pack.html PB_PORT=4263 sh tools/probe.sh x /tmp/timber ; then x.jpg, x_n.jpg -> assets/wreck-x.jpg, wreck-x-n.jpg -->
