<!doctype html>
<meta charset="utf-8">
<title>load all</title>
<!-- EVERY CHECKPOINT'S LOAD, TIMED (2026-11-13, the owner: "make sure all load times are fast as possible check every
     checkpoint"). Not part of the game. Run headless (tools/loadall.sh): for each place a checkpoint can be written —
     the beach at several stretches and every room in `ROOM_BACK`, at its door's spot — it starts the game fresh in an
     iframe, goes there the room's own way (`load`, `place`), writes the checkpoint, then reloads into it the way a death
     does (card up, Restart clicked at once) and logs when it is playable and the frames after. Lines start "[LA]".
     ?only=tav,whale picks some; ?runs=N repeats each load. Its own profile: never the owner's save. -->
<body style="margin:0;background:#000">
<iframe id="g" style="width:1280px;height:720px;border:0"></iframe>
<script>
const P = new URLSearchParams(location.search), RUNS = +(P.get('runs') || 1), AFTER = +(P.get('after') || 8000);
const log = (...a) => console.log('[LA]', ...a);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('g');
// [name, how: 'beach' with a z, or a ROOM_BACK key with its spot]
const ALL = [
  ['beach-60', 'beach', -60], ['beach-300', 'beach', -300], ['beach-600', 'beach', -600], ['beach-900', 'beach', -900], ['beach-1000', 'beach', -1000],
  ['bunker', 'bunker', 'bunkerIn'], ['uc', 'uc', 'ucIn'], ['ucFar', 'uc', 'ucInFar'], ['sewer', 'sewer', 'sewIn'], ['dun', 'dun', null],
  ['dojo', 'dojo', 'dojoIn'], ['cat', 'cat', 'catIn'], ['whale', 'whale', 'whaleIn'], ['keep', 'keep', 'keepIn'], ['keepDoor', 'keep', 'keepDoor'],
  ['tav', 'tav', 'tavIn'], ['fort', 'fort', 'fortIn'], ['c13', 'c13', 'c13In'], ['thr', 'thr', 'thrIn'], ['deep', 'deep', 'deepSnap'],
];
const only = P.get('only') ? P.get('only').split(',') : null;
async function load(setup) {
  f.src = 'about:blank'; await sleep(200);
  for (const k of ['beachwalk.load', 'beachwalk.skipIntro', 'beachwalk.died']) sessionStorage.removeItem(k);
  if (setup) setup();
  const t0 = performance.now();
  f.src = '/index.html';
  let w = null;
  for (let i = 0; i < 200; i++) { await sleep(25); try { w = f.contentWindow; if (w.__bw) break; } catch (e) {} }
  return { w, t0, built: (performance.now() - t0) / 1000 };
}
async function writeCheckpoint(how, arg) {
  const { w } = await load(() => sessionStorage.setItem('beachwalk.skipIntro', '1'));
  const b = w.__bw;
  for (let i = 0; i < 200 && !b.state().started; i++) { try { b.beginGame(); } catch (e) {} await sleep(250); }
  for (let i = 0; i < 200 && !b.state().introDone; i++) await sleep(100);
  await sleep(1500);
  if (how === 'beach') { b.camera.position.set(8, 1.7, arg); await sleep(1500); b.saveCheckpoint(); }
  else if (how === 'deep') {
    // the bite, then on to the plunge and the end of the long pull, run for real until the line snaps (the save is the game's own)
    w.requestAnimationFrame = () => 0;
    if (!b.inventory.includes(b.fishingRodItem)) b.addToInventory(b.fishingRodItem);
    b.startDeepHook();
    const D = b.deepS(), plio = b.plioS();
    for (let i = 0; i < 400 && !plio.ready; i++) { b.frame(1); await sleep(25); }
    if (!plio.ready) return 'the pliosaur never loaded';
    D.ph = 'plunge'; D.t = 0.3; D.plY = b.camera.position.y;
    for (let i = 0; i < 30 && D.ph !== 'descent'; i++) b.frame(1);
    if (D.ph !== 'descent') return 'no descent: ' + D.ph;
    D.t = 8.6; localStorage.removeItem('beachwalk.save');
    for (let i = 0; i < 300 && !D.snapped; i++) { b.frame(1); await sleep(16); }
    if (!D.snapped) return 'never snapped';
    const s = JSON.parse(localStorage.getItem('beachwalk.save') || 'null');
    if (!s) return 'the snap wrote no checkpoint';
    log('deep: written at the snap: room', s.room, 'spot', s.spot, 'rod in pack', (s.pack || s.inventory || []).join ? (s.pack || s.inventory).includes('Fishing Rod') : '?');
  } else {
    const R = b.ROOM_BACK[how]; R.load();
    for (let i = 0; i < 1200 && !R.ready(); i++) { await sleep(50); if (i % 40 === 39) R.load(); }
    if (!R.ready()) return 'never ready';
    b.clearRoomFlags(); R.place(); if (arg && R.spots[arg]) R.spots[arg]();
    await sleep(1500);
    if (b.devRoom() !== how) return 'not in it after place: ' + b.devRoom();
    b.saveCheckpoint(arg || undefined);
  }
  const d = JSON.parse(localStorage.getItem('beachwalk.save') || 'null');
  try { await b.audioCtx.close(); } catch (e) {}
  return d ? true : 'nothing saved';
}
(async () => {
  const rows = [];
  for (const [name, how, arg] of ALL) {
    if (only && !only.includes(name)) continue;
    localStorage.removeItem('beachwalk.save');
    const ok = await writeCheckpoint(how, arg);
    if (ok !== true) { log(name, 'SKIPPED', ok); rows.push([name, 'skipped: ' + ok]); continue; }
    const sv = JSON.parse(localStorage.getItem('beachwalk.save'));
    for (let r = 0; r < RUNS; r++) {
      const L = await load(() => { sessionStorage.setItem('beachwalk.load', 'checkpoint'); sessionStorage.setItem('beachwalk.skipIntro', '1'); sessionStorage.setItem('beachwalk.died', '1'); });
      const w = L.w, t0 = L.t0;
      const btn = w.document.querySelector('.dc-restart'); if (btn) btn.click();
      let up = null;
      const TL = []; for (let i = 0; i < 2400; i++) { await sleep(25); const b = w.__bw; if (!b) continue; if (i % 10 === 0 && b.bootGateS) { try { const g = b.bootGateS(), L = b.bootLeft(); TL.push(`${((performance.now() - t0) / 1000).toFixed(1)}:${g.hold ? 'H' : '-'}${g.roomRestore ? 'R' : ''}${g.restore ? 'r' : ''}${g.roomWarm ? 'W' + g.roomWarm : ''}${g.warmBlock ? 'B' : ''}${g.look ? 'L' : ''}${g.owed ? 'O' : ''}${g.stage ? 'S' : ''} left${g.left} s${g.smooth} p${L.parsing} q${L.waiting.slice(0, 2).join('+')} w${L.warm[0] || ''}`); } catch (e) { TL.push('err ' + e.message); } } if ((!b.frozen() || b.state().dialogOpen) && b.state().introDone) { up = (performance.now() - t0) / 1000; break; } }
      const b = w.__bw, room = b.devRoom();
      if (P.get('tl') || (up && up > 5.6)) log('  timeline', JSON.stringify(TL));
      if (!up) { const st = b.state(), q = b.restoreS ? b.restoreS() : {}; log(name, 'NEVER PLAYABLE: frozen', b.frozen(), 'introDone', st.introDone, 'restore', JSON.stringify(q).slice(0, 300), 'gate', JSON.stringify(b.bootGateS ? b.bootGateS() : null).slice(0, 300), 'blackout', w.document.getElementById('blackout').style.opacity, 'died', w.document.documentElement.className, 'state', JSON.stringify(st).slice(0, 400)); }
      const FR = [], BIG = [], RING = []; let fl = performance.now(), on = true; const tU = performance.now(); const raf = w.requestAnimationFrame.bind(w); (function fr() { const n = performance.now(); const bl = b.bootLeft(); const lt = b.lagTime(16), le = lt[lt.length - 1]; RING.push(bl.nWarm + ':' + (bl.warm[0] || '-') + (bl.parsing ? ' P' + bl.parsing : '') + (le ? ' last[' + le[2] + ' ' + le[1] + 'ms ' + Math.round(w.performance.now() - le[0]) + 'ago]' : '')); if (RING.length > 4) RING.shift(); if (n - fl > 90) BIG.push(RING.join(' > ') + ` +${((n - tU) / 1000).toFixed(2)}s ${Math.round(n - fl)}ms hold ${b.restoreS().bootHold.toFixed(2)} black ${w.document.getElementById('blackout').style.opacity} prog ${b.renderer.info.programs.length} tex ${b.renderer.info.memory.textures}`); FR.push(n - fl); fl = n; if (on) raf(fr); })();
      const lag0 = b.lag().length, tUp = w.performance.now(), loaf = []; let LN = 0;
      try { new w.PerformanceObserver((l) => { for (const e of l.getEntries()) { LN++; if (e.startTime > tUp && e.duration > 90) loaf.push(e); } }).observe({ type: 'long-animation-frame', buffered: true }); } catch (e) { log('no LoAF', e.message); }
      const pUp = b.renderer.info.programs.length; await sleep(1500);
      { const I = b.renderer.info, mats = new Map(); b.scene.traverse((o) => { if (o.material) for (const m of [].concat(o.material)) mats.set(m, o); });
        const names = {}; for (const pr of I.programs.slice(pUp)) { let who = '?'; for (const [m, o] of mats) { const pp = b.renderer.properties.get(m); if (pp && pp.currentProgram === pr) { let r = o; while (r.parent && r.parent !== b.scene) r = r.parent; who = (r.name || r.type) + '/' + (o.name || '').slice(0, 20) + '/' + m.type; break; } } names[who] = (names[who] || 0) + 1; }
        log('  programs built in the 1.5 s after playable', I.programs.length - pUp, JSON.stringify(names)); }
      await sleep(Math.max(0, AFTER - 1500)); on = false; if (BIG.length) log('  gaps', JSON.stringify(BIG)); log('  LoAF entries seen', LN, 'over 90 after', loaf.length);
      for (const e of loaf.sort((a, c) => c.duration - a.duration).slice(0, 3)) log('  long frame', '+' + ((e.startTime - tUp) / 1000).toFixed(2) + 's', Math.round(e.duration) + 'ms', 'block', Math.round(e.blockingDuration), 'render', Math.round(e.startTime + e.duration - e.renderStart), 'style', Math.round(e.startTime + e.duration - (e.styleAndLayoutStart || e.startTime + e.duration)), 'scripts', JSON.stringify(e.scripts.map((s) => [Math.round(s.duration), s.invoker, s.invokerType, s.sourceFunctionName, s.sourceURL.split('/').pop(), s.sourceCharPosition]).sort((a, c) => c[0] - a[0]).slice(0, 4)));
      if (how === 'deep') { await sleep(6000); const D = b.deepS(), fl = b.deepFlags, c = b.camera.position; log('deep after the load:', 'ph', D.ph, 't', D.t.toFixed(1), 'inDeep', fl.inDeep, 'lock', fl.deepLock, 'hands', !fl.deepNoHands, 'rod in pack', b.inventory.includes(b.fishingRodItem), 'pliosaur', b.plioS().st, 'cam', c.x.toFixed(1), c.y.toFixed(1), c.z.toFixed(1), 'fog', b.scene.fog.density.toFixed(3), 'blackout', w.document.getElementById('blackout') ? w.document.getElementById('blackout').style.opacity : '?'); }
      const F = FR.slice(1), srt = F.slice().sort((a, c) => a - c);
      const spans = b.lagTime(16).filter((e) => e[0] >= tUp - 50).map((e) => Math.round(e[1]) + ':' + String(e[2]).slice(0, 26)).sort((a, c) => parseInt(c) - parseInt(a)).slice(0, 6);
      const row = `${name} room ${sv.room || 'beach'}→${room} built ${L.built.toFixed(2)} playable ${up ? up.toFixed(2) : 'NEVER'} s | ${AFTER / 1000}s after: frames ${F.length} p95 ${Math.round(srt[Math.floor(srt.length * 0.95)] || 0)} max ${Math.round(Math.max(0, ...F))} >50ms ${F.filter((d) => d > 50).length} >100ms ${F.filter((d) => d > 100).length} | worst spans ${JSON.stringify(spans)}`;
      log(row); rows.push([name, row]);
      try { await b.audioCtx.close(); } catch (e) {}
    }
  }
  log('SUMMARY'); for (const [n, r] of rows) log('  ', r);
  log('DONE');
})().catch((e) => log('FAILED', e && e.stack || e));
</script>
