<!doctype html><meta charset="utf-8"><title>pane sheet</title>
<!-- EVERY ITEM IN THE PACK'S LIVE PANE (2026-11-18). Not part of the game. Each item mounted in the pane's own renderer
     (`__bw.pvLook`), settled, shot, then turned on a second and shot again; laid out with its pose and material.
       sh tools/pvsheet.sh [out.png]   (headless, its own port 4216) -->
<style>html, body { margin: 0; background: #111; color: #ccd; font: 11px monospace; } iframe { position: absolute; left: -4000px; width: 1280px; height: 720px; border: 0; }
#g { display: grid; grid-template-columns: repeat(8, 290px); gap: 6px; padding: 6px; } .c { background: #000; } .c img { width: 140px; height: 140px; image-rendering: pixelated; } .c div { padding: 2px 4px; white-space: nowrap; overflow: hidden; }</style>
<div id="g"></div><iframe id="f" src="/index.html"></iframe>
<script>
const f = document.getElementById('f'), G = document.getElementById('g');
sessionStorage.setItem('beachwalk.skipIntro', '1');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const NAMES = ['Sand shovel', 'Military Shovel', 'Katana', 'Bloody Blade', 'Spare Peg', 'Glowstick', 'The Octopus Ring', 'Forgotten Wedding Ring',
  'Skull Key', 'New Cd', 'Horseshoe crab', 'Syringe', 'Bottle of water', 'Fishing rod', '.44 Magnum',
  'The Sawed Off Shotgun', 'Mutant Fang', 'Old Ring', 'Wax Spliff', 'Memory of grammy orc', 'Lucky bastards ring', 'Artifact of the Whale',
  'Tavern storage key', 'Artifact of the Flame', 'Artifact of the Sea', 'Fancy house gate key', 'Homeowners Portrait', 'The Great Crab Call',
  "Henry's cell key", 'Gold Ring', 'Ring of Connection', 'Screwdriver', 'Flashlight', 'Big Mouth Billy Bass', 'The Shock Ring', 'Bone Mace', 'Blood Jar', "Captain's Chest Key"];
f.addEventListener('load', async () => {
  const w = f.contentWindow;
  for (let i = 0; i < 200 && !w.__bw; i++) await wait(100);
  const b = w.__bw;
  const errs = []; for (const k of ['error', 'warn']) { const o = w.console[k].bind(w.console); w.console[k] = (...a) => { errs.push(String(a[0]).slice(0, 90)); o(...a); }; }
  for (let i = 0; i < 200 && !b.state().started; i++) { try { b.beginGame(); } catch (e) { } b.frame(1); await wait(60); }
  const extra = { 'Blood Jar': () => b.jarItem, 'Bone Mace': () => b.maceItem };
  // ?strip=A|B|C: each one's first 1.3 s, a frame every 0.1 s (the set-down, the rock, the first glint)
  const strip = new URLSearchParams(location.search).get('strip');
  if (strip) {
    G.style.gridTemplateColumns = 'repeat(13, 142px)';
    for (const n of strip.split('|')) {
      const it = b.packByName(n) || (extra[n] && extra[n]());
      let a = null; for (let k = 0; k < 60 && !a; k++) { a = it && b.pvLook(it, 0.02); if (!a) { b.frame(2); await wait(150); } }
      const fr = [a]; for (let k = 0; k < 12; k++) fr.push(b.pvMore(0.1));
      for (const u of fr) { const c = document.createElement('div'); c.className = 'c'; c.innerHTML = `<img src="${u}">`; G.appendChild(c); }
    }
    document.title = 'done'; return;
  }
  for (const n of NAMES) {
    const it = b.packByName(n) || (extra[n] && extra[n]());
    const cell = document.createElement('div'); cell.className = 'c'; G.appendChild(cell);
    if (!it) { cell.innerHTML = `<div>${n}: no item</div>`; continue; }
    let a = null;
    for (let k = 0; k < 60 && !a; k++) { try { a = b.pvLook(it); } catch (e) { cell.innerHTML = `<div>${n}: ${e.message}</div>`; break; } if (!a) { b.frame(2); await wait(150); } }
    if (!a) { if (!cell.innerHTML) cell.innerHTML = `<div>${n}: model not ready</div>`; continue; }
    const c2 = b.pvMore(1.4), P = b.pvProfile(it), S = b.pvS(), D = b.pvDbg();
    cell.innerHTML = `<img src="${a}"><img src="${c2}"><div>${n} · ${S.pose} · ${P.mat}${P.glow ? ' · glow' : ''}${P.slosh ? ' · slosh' : ''}${P.twitch ? ' · ' + P.twitch : ''}</div><div>${JSON.stringify(D)}</div><div>${errs.slice(-2).join(' | ')}</div>`;
  }
  document.title = 'done';
});
</script>
